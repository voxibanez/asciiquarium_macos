name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build saver
    runs-on: macos-14
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: make test

      - name: Build screen saver
        run: |
          make clean
          make

      - name: Package artifact
        id: package
        run: |
          version="${GITHUB_SHA}"
          version="${version//\//-}"
          make package VERSION="$version"
          echo "archive=dist/AsciiFishtank-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsciiFishtank-${{ github.run_number }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Sign, notarize, and release saver
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: make test

      - name: Validate Apple signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_PASSWORD \
            KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for tagged release signing and notarization"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | tee identities.txt
          identity="$(
            awk -F '"' '/Developer ID Application/ { print $2; exit }' identities.txt
          )"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity found after importing certificate"
            exit 1
          fi
          echo "Using signing identity: $identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f certificate.p12

      - name: Build screen saver
        run: |
          make clean
          make \
            VERSION="${GITHUB_REF_NAME}" \
            CODESIGN_IDENTITY="${{ steps.signing.outputs.identity }}" \
            CODESIGN_FLAGS="--timestamp --options runtime"

      - name: Notarize and staple screen saver
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent AsciiFishtank.saver notarization.zip
          xcrun notarytool submit notarization.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple AsciiFishtank.saver
          xcrun stapler validate AsciiFishtank.saver
          codesign --verify --deep --strict --verbose=2 AsciiFishtank.saver

      - name: Package artifact
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          version="${version//\//-}"
          make package VERSION="$version"
          echo "archive=dist/AsciiFishtank-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsciiFishtank-${{ github.run_number }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${{ steps.package.outputs.archive }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$archive" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$archive" \
              --title "AsciiFishtank ${GITHUB_REF_NAME}" \
              --notes "Release build for ${GITHUB_REF_NAME}."
          fi
