name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Test and build saver
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: make test

      - name: Build screen saver
        run: |
          make clean
          make

      - name: Package artifact
        id: package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA}"
          fi
          version="${version//\//-}"
          make package VERSION="$version"
          echo "archive=dist/AsciiFishtank-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsciiFishtank-${{ github.run_number }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${{ steps.package.outputs.archive }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$archive" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$archive" \
              --title "AsciiFishtank ${GITHUB_REF_NAME}" \
              --notes "Release build for ${GITHUB_REF_NAME}."
          fi
